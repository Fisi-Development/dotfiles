# Delegation model policy. Rules: delegation-skills/shared/references/model-policy.md
# Migrated 2026-09-22 from ~/.agents/offload-models.md (kept until you delete it).
# 2026-10-01: GPT Sol is the default producer, starting at medium effort. Wallet
# order is work Codex, then personal Codex. Backup: model-policy.toml.bak-20261001.
schema = 2
# 2026-10-08: schema 2 role names (orchestrator, executor, light, reviewer, premium).
# Rules: delegation-skills/shared/references/layered-routing.md. Swap a model with the model-swap skill.

[roles]
mode = "architect"
orchestrator = "claude/fable"        # the main agent; reads intent, designs, reviews, integrates (Royal, 2026-11-09: Fable 5.2 plans and orchestrates other models)
captain = "claude/opus@medium"      # bosun captains, Auspex/Lookout overseers: coordinators, not orchestrators (Royal, 2026-11-10: captains stay on Opus medium when orchestrator moved to Fable)
executor = ["firerouter/router"]     # closed contracts; FireRouter as a trial (Royal, 2026-11-10); every FireRouter diff gets an Opus review pass (delegate.py --review --author firerouter)
hard_start = "gpt/sol@medium"        # a FireRouter miss, or a unit the parent judges hard, goes to --role hard_start; raise effort one level per further miss, to xhigh
light = "gpt/terra@low"              # recon and one-shot mechanical edits; Harbor D066 (2026-11-05 scout benchmark) picked Terra; fast mode dropped 2026-11-07 (Royal: measurements say avoid fast mode, Claude and GPT priority tier alike)
# light = "claude/haiku@medium"      # UNCONFIRMED option (2026-10-08): bills the Claude subscription
scout = "firerouter/router"          # wide read-only scout fan-outs (3+ at once); Harbor research 2026-11-10 scout-bench-opencode: 38.5 and 37 of 40 blind, every verdict right (Royal, 2026-11-10)
reviewer = "glm/flash"               # company LiteLLM review grant, 2026-10-05; parent reviews deliverables too
premium = "claude/opus"              # judges, never types: cross-family review of GPT-authored work (2026-11-07, token-spend routing), so Claude keeps review when orchestrator moves to GPT

[pins]                               # GPT, Claude, and Grok tiers auto-resolve to the newest slug; pin only to hold one back
"glm/flash" = "fireworks_ai/accounts/fireworks/models/glm-5p3-flash"
"firerouter/router" = "accounts/fireworks/routers/firerouter"

# Route order is preference order: the first reachable route for a tier wins.
[wallets.chatgpt-work]
kind = "subscription"
codex_home = "~/.codex-work"         # work ChatGPT login

[wallets.chatgpt]
kind = "subscription"
codex_home = "~/.codex"              # personal ChatGPT login

[wallets.claude]
kind = "subscription"

[wallets.company-litellm]             # company gateway verified 2026-10-05; GLM review and FireRouter scout/executor grants only
kind = "metered"

# GPT: CLI through codex exec, work login first, then personal. Native in Codex.
# No OpenRouter or other metered GPT route.
[[routes]]
family = "gpt"
via = "cli"
harness = "codex"
wallet = "chatgpt-work"

[[routes]]
family = "gpt"
via = "cli"
harness = "codex"
wallet = "chatgpt"

[[routes]]
family = "gpt"
via = "native"
harness = "codex"
wallet = "chatgpt-work"              # native children bill whichever login the parent Codex runs on

# OpenCode's OpenAI provider is retired (Royal, 2026-11-02): its children failed with 401
# while interactive login worked. GPT work runs through Codex.

# Claude: only through Claude Code itself, as a native child or `claude -p`.
[[routes]]
family = "claude"
via = "native"
harness = "claude-code"
wallet = "claude"

[[routes]]
family = "claude"
via = "cli"
harness = "claude-code"
wallet = "claude"

# GLM: exact company gateway and payload scope in authorization-policy.md.
[[routes]]
family = "glm"
via = "native"
harness = "opencode"
provider = "litellm"
wallet = "company-litellm"

[[routes]]
family = "glm"
via = "cli"
harness = "opencode"
provider = "litellm"
wallet = "company-litellm"

# FireRouter: the same company gateway and payload scope as GLM; scouting,
# swarm reading and executor units with an Opus review pass (authorization-policy.md,
# Royal 2026-11-10).
[[routes]]
family = "firerouter"
via = "native"
harness = "opencode"
provider = "litellm"
wallet = "company-litellm"

[[routes]]
family = "firerouter"
via = "cli"
harness = "opencode"
provider = "litellm"
wallet = "company-litellm"

# Grok: no routes. The old file said "Do not fall back to ... Grok".
